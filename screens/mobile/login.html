<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAO IPTV - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    body { background: radial-gradient(circle at 50% 20%, #17233f, #0a0e1a 80%); font-family: 'Outfit', sans-serif; color: #fff; }
    .glass { background: rgba(18, 23, 39, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(0, 229, 255, 0.15); }
    .neon-border:focus-within { border-color: #00e5ff; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-tr from-cyan-400 via-blue-500 to-purple-600 p-[2px] shadow-2xl shadow-cyan-500/30 mb-4">
        <div class="w-full h-full bg-[#0a0e1a] rounded-[22px] flex items-center justify-center">
          <i class="fa-solid fa-play text-3xl text-cyan-400 ml-1"></i>
        </div>
      </div>
      <h1 class="text-3xl font-black tracking-wider text-white">WAO IPTV</h1>
      <p class="text-xs text-cyan-400 font-semibold tracking-widest uppercase mt-1">Stream Anytime • Anywhere</p>
    </div>

    <div class="glass rounded-3xl p-6 shadow-2xl">
      <div class="grid grid-cols-2 gap-2 p-1 bg-slate-900/80 rounded-2xl mb-6">
        <button id="btn-xtream" onclick="switchMode('xtream')" class="py-2.5 text-xs font-bold rounded-xl bg-cyan-400 text-slate-950 transition">
          <i class="fa-solid fa-user-gear mr-1"></i> Xtream Codes
        </button>
        <button id="btn-m3u" onclick="switchMode('m3u')" class="py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-link mr-1"></i> M3U Playlist
        </button>
      </div>

      <form id="form-xtream" onsubmit="handleLogin(event)" class="space-y-4">
        <div class="neon-border rounded-2xl bg-slate-950/60 border border-slate-800 px-4 py-2.5 transition">
          <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Server URL</label>
          <div class="flex items-center gap-2 mt-0.5">
            <i class="fa-solid fa-globe text-xs text-cyan-400"></i>
            <input type="url" required value="http://my-iptv-server.com:8080" class="w-full bg-transparent text-sm text-white focus:outline-none placeholder-slate-600"/>
          </div>
        </div>

        <div class="neon-border rounded-2xl bg-slate-950/60 border border-slate-800 px-4 py-2.5 transition">
          <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Username</label>
          <div class="flex items-center gap-2 mt-0.5">
            <i class="fa-solid fa-user text-xs text-cyan-400"></i>
            <input type="text" required placeholder="Enter Xtream username" class="w-full bg-transparent text-sm text-white focus:outline-none placeholder-slate-600"/>
          </div>
        </div>

        <div class="neon-border rounded-2xl bg-slate-950/60 border border-slate-800 px-4 py-2.5 transition">
          <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Password</label>
          <div class="flex items-center gap-2 mt-0.5">
            <i class="fa-solid fa-lock text-xs text-cyan-400"></i>
            <input type="password" required placeholder="••••••••" class="w-full bg-transparent text-sm text-white focus:outline-none placeholder-slate-600"/>
          </div>
        </div>

        <button type="submit" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 font-black text-sm tracking-wider uppercase shadow-lg shadow-cyan-400/25 hover:opacity-95 transition">
          Connect & Load Channels
        </button>
      </form>

      <form id="form-m3u" onsubmit="handleLogin(event)" class="space-y-4 hidden">
        <div class="neon-border rounded-2xl bg-slate-950/60 border border-slate-800 px-4 py-2.5 transition">
          <label class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">M3U Playlist URL</label>
          <div class="flex items-center gap-2 mt-0.5">
            <i class="fa-solid fa-link text-xs text-cyan-400"></i>
            <input type="url" placeholder="https://provider.com/get.php?username=..." class="w-full bg-transparent text-sm text-white focus:outline-none placeholder-slate-600"/>
          </div>
        </div>

        <button type="submit" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 font-black text-sm tracking-wider uppercase shadow-lg shadow-cyan-400/25 hover:opacity-95 transition">
          Load M3U Playlist
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-800/80 text-center">
        <p class="text-xs text-slate-400">Powered by MediaCodec HW+ & ExoPlayer</p>
      </div>
    </div>
  </div>

  <script>
    function switchMode(type) {
      const fX = document.getElementById('form-xtream');
      const fM = document.getElementById('form-m3u');
      const bX = document.getElementById('btn-xtream');
      const bM = document.getElementById('btn-m3u');

      if (type === 'xtream') {
        fX.classList.remove('hidden');
        fM.classList.add('hidden');
        bX.className = "py-2.5 text-xs font-bold rounded-xl bg-cyan-400 text-slate-950 transition";
        bM.className = "py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition";
      } else {
        fM.classList.remove('hidden');
        fX.classList.add('hidden');
        bM.className = "py-2.5 text-xs font-bold rounded-xl bg-cyan-400 text-slate-950 transition";
        bX.className = "py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition";
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      window.location.href = 'home.html';
    }
  </script>
</body>
</html>
