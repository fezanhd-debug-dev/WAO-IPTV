<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAO IPTV - Pro Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    body { background-color: #000; font-family: 'Outfit', sans-serif; color: #fff; }
    .glass-dark { background: rgba(10, 14, 26, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between relative select-none">

  <!-- Video / Stream Background -->
  <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=1200&fit=crop" class="absolute inset-0 w-full h-full object-cover -z-10 brightness-75"/>

  <!-- Top Controls Bar -->
  <div class="p-4 flex items-center justify-between glass-dark z-20">
    <div class="flex items-center gap-3">
      <a href="home.html" class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-white">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <div>
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 rounded text-[10px] font-black bg-red-600 text-white">LIVE</span>
          <h2 class="font-bold text-white text-sm">Sky Sports Main Event UHD</h2>
        </div>
        <p class="text-[11px] text-cyan-400">ICC T20 Super 8 • AUS vs IND</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button class="px-3 py-1.5 rounded-xl bg-white/10 text-xs font-semibold flex items-center gap-1.5">
        <i class="fa-solid fa-volume-high text-cyan-400"></i> Audio
      </button>
      <button class="px-3 py-1.5 rounded-xl bg-white/10 text-xs font-semibold flex items-center gap-1.5">
        <i class="fa-solid fa-expand text-cyan-400"></i> 16:9
      </button>
    </div>
  </div>

  <!-- Gesture Feedback Overlay (Brightness & Volume) -->
  <div class="flex items-center justify-around pointer-events-none px-8">
    <div class="glass-dark px-4 py-3 rounded-2xl flex flex-col items-center gap-2">
      <i class="fa-solid fa-sun text-amber-400 text-lg"></i>
      <div class="w-1.5 h-20 bg-white/20 rounded-full overflow-hidden flex flex-col justify-end">
        <div class="w-full h-3/4 bg-amber-400"></div>
      </div>
      <span class="text-[10px] font-bold">75%</span>
    </div>

    <div class="w-16 h-16 rounded-full bg-cyan-400/20 border border-cyan-400/40 flex items-center justify-center pointer-events-auto cursor-pointer" onclick="togglePlay(this)">
      <i class="fa-solid fa-pause text-cyan-400 text-2xl"></i>
    </div>

    <div class="glass-dark px-4 py-3 rounded-2xl flex flex-col items-center gap-2">
      <i class="fa-solid fa-volume-high text-cyan-400 text-lg"></i>
      <div class="w-1.5 h-20 bg-white/20 rounded-full overflow-hidden flex flex-col justify-end">
        <div class="w-full h-4/5 bg-cyan-400"></div>
      </div>
      <span class="text-[10px] font-bold">80%</span>
    </div>
  </div>

  <!-- Bottom Timeline & Stream Stats -->
  <div class="p-4 glass-dark z-20 space-y-3">
    <div class="flex items-center justify-between text-[11px] text-slate-300">
      <div class="flex items-center gap-2">
        <span class="text-cyan-400 font-bold">HEVC HW+</span>
        <span>•</span>
        <span>4K 60FPS</span>
        <span>•</span>
        <span>16.8 Mbps</span>
      </div>
      <div class="flex items-center gap-1 text-emerald-400 font-bold">
        <i class="fa-solid fa-wifi"></i> 99% Signal
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="flex-1 h-1.5 bg-white/20 rounded-full overflow-hidden">
        <div class="h-full bg-cyan-400 w-full animate-pulse"></div>
      </div>
      <span class="text-xs font-bold text-red-500">● LIVE</span>
    </div>
  </div>

  <script>
    function togglePlay(btn) {
      const icon = btn.querySelector('i');
      if (icon.classList.contains('fa-pause')) {
        icon.className = "fa-solid fa-play text-cyan-400 text-2xl ml-1";
      } else {
        icon.className = "fa-solid fa-pause text-cyan-400 text-2xl";
      }
    }
  </script>
</body>
</html>
