<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAO IPTV - Live TV & EPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    body { background-color: #0a0e1a; font-family: 'Outfit', sans-serif; color: #fff; }
    .glass { background: rgba(18, 23, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .ch-active { border: 1px solid #00e5ff; background: rgba(0, 229, 255, 0.08); }
  </style>
</head>
<body class="pb-24">

  <!-- Search & Mini Preview -->
  <div class="p-4 bg-[#0a0e1a] sticky top-0 z-40 border-b border-slate-800">
    <div class="relative mb-3">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-500 text-xs"></i>
      <input type="text" placeholder="Search 12,450+ channels..." class="w-full py-2.5 pl-9 pr-4 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400"/>
    </div>

    <div class="rounded-2xl overflow-hidden aspect-video bg-black relative border border-cyan-500/30 shadow-lg">
      <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=600&fit=crop" class="w-full h-full object-cover"/>
      <div class="absolute top-2 left-2 px-2 py-0.5 rounded text-[9px] font-black bg-red-600">LIVE 4K • 60 FPS</div>
      <div class="absolute bottom-2 left-2 right-2 flex items-center justify-between">
        <span class="text-xs font-bold text-white drop-shadow">101 Sky Sports Main Event</span>
        <a href="player.html" class="px-2.5 py-1 rounded bg-cyan-400 text-slate-950 font-bold text-[10px]">Fullscreen</a>
      </div>
    </div>
  </div>

  <!-- Channel List -->
  <div class="p-4 space-y-2.5">
    <div class="glass p-3 rounded-2xl flex items-center justify-between ch-active">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-cyan-400/20 text-cyan-400 flex items-center justify-center font-bold text-xs">101</div>
        <div>
          <h4 class="font-bold text-sm text-white">Sky Sports Main Event</h4>
          <p class="text-[11px] text-cyan-400">Premier League: MCI vs ARS (Live)</p>
          <div class="w-36 h-1 bg-slate-800 rounded-full mt-1.5 overflow-hidden">
            <div class="bg-cyan-400 h-full w-2/3"></div>
          </div>
        </div>
      </div>
      <a href="player.html" class="w-8 h-8 rounded-full bg-cyan-400 text-slate-950 flex items-center justify-center text-xs">
        <i class="fa-solid fa-play ml-0.5"></i>
      </a>
    </div>

    <div class="glass p-3 rounded-2xl flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 flex items-center justify-center font-bold text-xs">102</div>
        <div>
          <h4 class="font-bold text-sm text-white">TNT Sports 1 Ultimate</h4>
          <p class="text-[11px] text-slate-400">UEFA Champions League Highlights</p>
          <div class="w-36 h-1 bg-slate-800 rounded-full mt-1.5 overflow-hidden">
            <div class="bg-slate-500 h-full w-1/3"></div>
          </div>
        </div>
      </div>
      <a href="player.html" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center text-xs">
        <i class="fa-solid fa-play ml-0.5"></i>
      </a>
    </div>

    <div class="glass p-3 rounded-2xl flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-slate-800 text-slate-300 flex items-center justify-center font-bold text-xs">103</div>
        <div>
          <h4 class="font-bold text-sm text-white">beIN Sports 4K English</h4>
          <p class="text-[11px] text-slate-400">La Liga: Real Madrid vs Valencia</p>
          <div class="w-36 h-1 bg-slate-800 rounded-full mt-1.5 overflow-hidden">
            <div class="bg-slate-500 h-full w-1/2"></div>
          </div>
        </div>
      </div>
      <a href="player.html" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center text-xs">
        <i class="fa-solid fa-play ml-0.5"></i>
      </a>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="fixed bottom-0 left-0 right-0 glass border-t border-slate-800/80 px-6 py-3 flex items-center justify-between z-50 bg-[#0a0e1a]/95">
    <a href="home.html" class="flex flex-col items-center text-slate-400 hover:text-cyan-400">
      <i class="fa-solid fa-house text-lg"></i>
      <span class="text-[10px] font-bold mt-1">Home</span>
    </a>
    <a href="live-epg.html" class="flex flex-col items-center text-cyan-400">
      <i class="fa-solid fa-satellite-dish text-lg"></i>
      <span class="text-[10px] font-bold mt-1">Live TV</span>
    </a>
    <a href="vod-catalog.html" class="flex flex-col items-center text-slate-400 hover:text-cyan-400">
      <i class="fa-solid fa-film text-lg"></i>
      <span class="text-[10px] font-bold mt-1">VOD</span>
    </a>
    <a href="settings.html" class="flex flex-col items-center text-slate-400 hover:text-cyan-400">
      <i class="fa-solid fa-gear text-lg"></i>
      <span class="text-[10px] font-bold mt-1">Settings</span>
    </a>
  </div>
</body>
</html>
