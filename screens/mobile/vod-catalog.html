<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAO IPTV - VOD Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    body { background-color: #0a0e1a; font-family: 'Outfit', sans-serif; color: #fff; }
    .glass { background: rgba(18, 23, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="pb-24">

  <div class="p-4 bg-[#0a0e1a] sticky top-0 z-40 border-b border-slate-800">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-black text-white">VOD Entertainment</h2>
      <span class="text-xs px-2.5 py-1 rounded-full bg-purple-500/20 text-purple-400 font-bold border border-purple-500/30">45,000+ Titles</span>
    </div>
    <div class="grid grid-cols-2 gap-2 p-1 bg-slate-900 rounded-xl">
      <button class="py-2 text-xs font-bold rounded-lg bg-cyan-400 text-slate-950">Movies (35.8k)</button>
      <button class="py-2 text-xs font-bold rounded-lg text-slate-400">TV Series (8.2k)</button>
    </div>
  </div>

  <div class="p-4">
    <!-- Featured Hero Poster -->
    <div class="relative rounded-3xl overflow-hidden aspect-[4/3] shadow-2xl mb-6 border border-white/10">
      <img src="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=800&fit=crop" class="w-full h-full object-cover"/>
      <div class="absolute inset-0 bg-gradient-to-t from-[#0a0e1a] via-transparent to-transparent"></div>
      <div class="absolute bottom-4 left-4 right-4">
        <span class="px-2 py-0.5 rounded text-[10px] font-black bg-cyan-400 text-slate-950">4K HDR10+</span>
        <h3 class="text-xl font-bold text-white mt-1">Cyber Nexus: Rise of 2099</h3>
        <p class="text-xs text-slate-300">Sci-Fi • 2h 42m • Dolby Atmos</p>
        <a href="player.html" class="inline-block mt-3 px-4 py-2 rounded-xl bg-cyan-400 text-slate-950 text-xs font-bold shadow-lg shadow-cyan-400/25">
          <i class="fa-solid fa-play mr-1"></i> Watch Movie
        </a>
      </div>
    </div>

    <!-- 4K Movies Grid -->
    <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Trending 4K Titles</h3>
    <div class="grid grid-cols-2 gap-3">
      <a href="player.html" class="glass rounded-2xl p-2 block">
        <div class="relative rounded-xl overflow-hidden aspect-[2/3] mb-2">
          <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400&fit=crop" class="w-full h-full object-cover"/>
          <span class="absolute top-2 left-2 px-1.5 py-0.5 rounded text-[9px] font-bold bg-black/70">⭐ 8.9</span>
        </div>
        <h4 class="text-xs font-bold text-white truncate">Singularity Horizon</h4>
        <p class="text-[10px] text-slate-400">2024 • Sci-Fi / Adventure</p>
      </a>

      <a href="player.html" class="glass rounded-2xl p-2 block">
        <div class="relative rounded-xl overflow-hidden aspect-[2/3] mb-2">
          <img src="https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=400&fit=crop" class="w-full h-full object-cover"/>
          <span class="absolute top-2 left-2 px-1.5 py-0.5 rounded text-[9px] font-bold bg-black/70">⭐ 8.5</span>
        </div>
        <h4 class="text-xs font-bold text-white truncate">Quantum Rebirth</h4>
        <p class="text-[10px] text-slate-400">2024 • Mystery / Thriller</p>
      </a>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="fixed bottom-0 left-0 right-0 glass border-t border-slate-800/80 px-6 py-3 flex items-center justify-between z-50 bg-[#0a0e1a]/95">
    <a href="home.html" class="flex flex-col items-center text-slate-400 hover:text-cyan-400">
      <i class="fa-solid fa-house text-lg"></i>
      <span class="text-[10px] font-bold mt-1">Home</span>
    </a>
    <a href="live-epg.html" class="flex flex-col items-center text-slate-400 hover:text-cyan-400">
      <i class="fa-solid fa-satellite-dish text-lg"></i>
      <span class="text-[10px] font-bold mt-1">Live TV</span>
    </a>
    <a href="vod-catalog.html" class="flex flex-col items-center text-cyan-400">
      <i class="fa-solid fa-film text-lg"></i>
      <span class="text-[10px] font-bold mt-1">VOD</span>
    </a>
    <a href="settings.html" class="flex flex-col items-center text-slate-400 hover:text-cyan-400">
      <i class="fa-solid fa-gear text-lg"></i>
      <span class="text-[10px] font-bold mt-1">Settings</span>
    </a>
  </div>
</body>
</html>
