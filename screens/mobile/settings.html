<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAO IPTV - Settings & Parental Lock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    body { background-color: #0a0e1a; font-family: 'Outfit', sans-serif; color: #fff; }
    .glass { background: rgba(18, 23, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="pb-24">

  <div class="p-4 bg-[#0a0e1a] sticky top-0 z-40 border-b border-slate-800">
    <h2 class="text-lg font-black text-white">App Settings & Decoder</h2>
    <p class="text-xs text-slate-400">Manage hardware codecs, cache & parental PIN</p>
  </div>

  <div class="p-4 space-y-4">
    <!-- VIP Account Card -->
    <div class="glass p-4 rounded-2xl border border-cyan-500/20">
      <div class="flex items-center justify-between">
        <div>
          <span class="text-[10px] text-cyan-400 font-bold uppercase tracking-wider">VIP Account</span>
          <h4 class="font-bold text-white text-base">VIP_Streamer_78</h4>
          <p class="text-xs text-slate-400">Expires: 24 Dec 2026 (284 Days)</p>
        </div>
        <span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400">Active</span>
      </div>
    </div>

    <!-- Video Decoder Engine -->
    <div class="glass p-4 rounded-2xl">
      <h3 class="text-xs font-bold text-cyan-400 uppercase tracking-wider mb-3">Player Engine</h3>
      <div class="space-y-2">
        <label class="flex items-center justify-between p-2.5 rounded-xl bg-slate-900 border border-cyan-500/40">
          <span class="text-xs font-semibold text-white">WAO ExoPlayer v3.2 (HW+ Recommended)</span>
          <input type="radio" name="engine" checked class="text-cyan-400"/>
        </label>
        <label class="flex items-center justify-between p-2.5 rounded-xl bg-slate-900 border border-slate-800">
          <span class="text-xs font-semibold text-slate-300">VLC Internal Engine (Dolby DTS-HD)</span>
          <input type="radio" name="engine" class="text-cyan-400"/>
        </label>
      </div>
    </div>

    <!-- Parental Lock -->
    <div class="glass p-4 rounded-2xl">
      <h3 class="text-xs font-bold text-purple-400 uppercase tracking-wider mb-3">Parental Lock (4-Digit PIN)</h3>
      <div class="flex items-center justify-between py-2 border-b border-slate-800">
        <span class="text-xs text-slate-300">Master PIN Enforcement</span>
        <input type="checkbox" checked class="w-4 h-4 text-purple-500 rounded"/>
      </div>
      <div class="flex items-center justify-between py-2">
        <span class="text-xs text-slate-300">Adult 18+ Live & VOD</span>
        <span class="text-xs text-red-400 font-bold">🔒 Locked</span>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="fixed bottom-0 left-0 right-0 glass border-t border-slate-800/80 px-6 py-3 flex items-center justify-between z-50 bg-[#0a0e1a]/95">
    <a href="home.html" class="flex flex-col items-center text-slate-400 hover:text-cyan-400">
      <i class="fa-solid fa-house text-lg"></i>
      <span class="text-[10px] font-bold mt-1">Home</span>
    </a>
    <a href="live-epg.html" class="flex flex-col items-center text-slate-400 hover:text-cyan-400">
      <i class="fa-solid fa-satellite-dish text-lg"></i>
      <span class="text-[10px] font-bold mt-1">Live TV</span>
    </a>
    <a href="vod-catalog.html" class="flex flex-col items-center text-slate-400 hover:text-cyan-400">
      <i class="fa-solid fa-film text-lg"></i>
      <span class="text-[10px] font-bold mt-1">VOD</span>
    </a>
    <a href="settings.html" class="flex flex-col items-center text-cyan-400">
      <i class="fa-solid fa-gear text-lg"></i>
      <span class="text-[10px] font-bold mt-1">Settings</span>
    </a>
  </div>
</body>
</html>
